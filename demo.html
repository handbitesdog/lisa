<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lisa.css demo</title>
  <link rel="stylesheet" href="lisa.css" />
</head>
<body>
  <h1>Normalizer check</h1>

  <h2>Heading two</h2>
  <p>
    A paragraph with a <a href="#">link</a> to make sure anchor styling
    is inherited rather than the browser default blue underline.
  </p>

  <ul>
    <li>List item one</li>
    <li>List item two</li>
    <li>List item three</li>
  </ul>

  <button type="button">A button</button>

  <table>
    <thead>
      <tr>
        <th>Column A</th>
        <th>Column B</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Value 1</td>
        <td>Value 2</td>
      </tr>
      <tr>
        <td>Value 3</td>
        <td>Value 4</td>
      </tr>
    </tbody>
  </table>

  <hr />

  <h1>Layout</h1>

  <div class="flex" style="gap: 16px;">
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      Card A
    </div>
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      Card B
    </div>
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      Card C
    </div>
  </div>

  <div class="grid grid-cols-3" style="gap: 16px;">
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      1
    </div>
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      2
    </div>
    <div style="background: var(--color-paper); border: 1px solid var(--color-border);">
      3
    </div>
  </div>
</body>
</html>
